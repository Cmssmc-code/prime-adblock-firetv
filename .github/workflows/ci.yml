name: ci
on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the unit tests on the host
        run: |
          set -e
          for t in test_rego_stream test_remote_strip; do
            g++ -std=c++17 -O1 -Wall -Wextra "src/native/$t.cpp" -o "/tmp/$t"
            "/tmp/$t" | tail -3
          done

  native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libpvhook.so (armeabi-v7a)
        run: |
          set -e
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          tools/build.sh build
          ls -l build/libpvhook.so
          sha256sum build/libpvhook.so
      - uses: actions/upload-artifact@v4
        with:
          name: libpvhook-armeabi-v7a
          path: build/libpvhook.so

  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Syntax-check the tools
        run: python -m py_compile tools/*.py
