name: ci
on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the unit tests on the host
        run: |
          set -e
          g++ -std=c++17 -O1 -Wall src/native/test_rego_stream.cpp -o /tmp/test_rego_stream
          /tmp/test_rego_stream | tail -3
          g++ -std=c++17 -O1 -Wall src/native/test_remote_strip.cpp src/native/remote_strip.cpp -o /tmp/test_remote_strip
          /tmp/test_remote_strip | tail -3

  native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libpvhook.so (armeabi-v7a)
        run: |
          set -e
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          bash tools/build.sh build
          ls -l build/libpvhook.so
          sha256sum build/libpvhook.so
      - uses: actions/upload-artifact@v4
        with:
          name: libpvhook-armeabi-v7a
          path: build/libpvhook.so

  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Syntax-check the tools
        run: python -m py_compile tools/*.py
